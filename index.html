                      {/* Minute 1 */}
                      <div className="relative pl-8 border-l-2 border-slate-200">
                        <div className="absolute w-8 h-8 bg-slate-900 text-white font-bold rounded-full flex items-center justify-center -left-[17px] top-0 text-sm">1</div>
                        <h3 className="text-lg font-bold text-slate-800 mb-2">Menit 1: Pembukaan & Masalah Nyata (The Hook)</h3>
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-slate-700 leading-relaxed italic relative">
                          <span className="absolute text-6xl text-slate-200 -top-4 -left-2 font-serif opacity-50">"</span>
                          Selamat pagi/siang Dewan Juri Wirasena 2026 yang terhormat. Saya Muh. Armil Syam, delegasi dari Kabupaten Pandeglang, Provinsi Banten.<br/><br/>
                          Pandeglang dikenal sebagai Kota Santri. Di Kecamatan Kaduhejo, tempat saya tinggal, ratusan pemuda dan santri menimba ilmu agama dengan luar biasa. Namun, di balik itu, kita menghadapi kenyataan pahit: <strong>angka putus sekolah yang cukup tinggi dan minimnya keterampilan praktis siap kerja bagi para santri salafi setelah mereka lulus.</strong><br/><br/>
                          Apakah kita akan membiarkan modal sosial yang besar ini menjadi beban daerah? Tentu tidak. Solusi yang saya bawa bukan sekadar membuka usaha, melainkan sebuah gerakan ekonomi sirkular bernama: <strong>Jawara Barber Academy.</strong>
                        </div>
                      </div>

                      {/* Minute 2 */}
                      <div className="relative pl-8 border-l-2 border-slate-200">
                        <div className="absolute w-8 h-8 bg-amber-500 text-slate-900 font-bold rounded-full flex items-center justify-center -left-[17px] top-0 text-sm">2</div>
                        <h3 className="text-lg font-bold text-slate-800 mb-2">Menit 2: Solusi, Inovasi & Model Bisnis (The Solution)</h3>
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-slate-700 leading-relaxed italic relative">
                          <span className="absolute text-6xl text-slate-200 -top-4 -left-2 font-serif opacity-50">"</span>
                          Jawara Barber Academy adalah wirausaha sosial berbentuk modern barbershop yang mengintegrasikan fungsi pelatihan kerja gratis untuk anak putus sekolah dan santri di Kaduhejo.<br/><br/>
                          Inovasi kami terletak pada program <strong>'Santri Cukur Mandiri'</strong>. Kami memberikan pelatihan teknik potong rambut, manajemen, dan hospitality gratis selama 2 bulan. Bagaimana bisnis ini bertahan tanpa donasi?<br/><br/>
                          Kami menggunakan model bisnis mandiri. Dengan tarif terjangkau Rp15.000, outlet kami menargetkan 15 pelanggan per hari, menghasilkan omzet Rp6.750.000 per bulan. <strong>Sebesar 40% dari laba bersih langsung dialokasikan kembali sebagai dana subsidi pelatihan.</strong> Pelanggan yang datang mencukur, secara tidak langsung sedang mendanai masa depan anak muda di Pandeglang.
                        </div>
                      </div>

                      {/* Minute 3 */}
                      <div className="relative pl-8 border-l-2 border-transparent">
                        <div className="absolute w-8 h-8 bg-emerald-500 text-white font-bold rounded-full flex items-center justify-center -left-[17px] top-0 text-sm">3</div>
                        <h3 className="text-lg font-bold text-slate-800 mb-2">Menit 3: Dampak & Penutup (The Impact & Closing)</h3>
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-slate-700 leading-relaxed italic relative">
                          <span className="absolute text-6xl text-slate-200 -top-4 -left-2 font-serif opacity-50">"</span>
                          Dalam satu tahun pertama, target kami nyata:<br/>
                          1. Melatih dan melahirkan 12 profesional barber baru dari kalangan santri/anak putus sekolah.<br/>
                          2. Membekali mereka 'Paket Barber Mandiri' agar bisa buka jasa di desa asal mereka.<br/>
                          3. Mengadakan 'Cukur Berbagi' gratis ke pelosok pesantren.<br/><br/>
                          Kami tidak hanya memotong rambut; <strong>kami sedang memotong mata rantai kemiskinan dan pengangguran di Banten.</strong> Melalui Wirasena 2026, saya siap membuktikan dari Kaduhejo, pemuda santri bisa bangkit jadi jawara ekonomi yang mandiri. Terima kasih.
                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* MODAL CANVAS DETAIL */}
          {selectedCanvas && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-100 transition-transform">
                <div className="bg-slate-900 p-4 flex justify-between items-center text-white">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">{selectedCanvas.icon}</span>
                    <h3 className="font-bold text-lg">{selectedCanvas.title}</h3>
                  </div>
                  <button 
                    onClick={() => setSelectedCanvas(null)}
                    className="text-slate-400 hover:text-white transition-colors bg-slate-800 hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>
                <div className="p-6">
                  <ul className="space-y-4">
                    {selectedCanvas.content.split('\n').map((line, idx) => (
                      <li key={idx} className="flex gap-3 text-slate-700 leading-relaxed">
                        {line.startsWith('•') ? (
                          <>
                            <span className="text-amber-500 font-bold mt-0.5">•</span>
                            <span>{line.substring(2)}</span>
                          </>
                        ) : (
                          line
                        )}
                      </li>
                    ))}
                  </ul>
                  <div className="mt-8 pt-4 border-t border-slate-100 flex justify-end">
                    <button 
                      onClick={() => setSelectedCanvas(null)}
                      className="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 px-6 rounded-lg transition-colors"
                    >
                      Tutup
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
